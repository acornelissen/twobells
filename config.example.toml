# Copy to /etc/departureboard/config.toml and edit.
# Secrets live in /etc/departureboard/secrets.env, not here.
#
# The settings page's setup wizard can set the board up for you, saving its
# answers beside the state file over this one: until it is set up, the board
# shows "Set me up" and the page's address. To do it by hand instead, replace
# every CHANGE_ME; the board shows no departures until you do. If you don't
# want trains or buses, put enabled = false in [train] or [bus] (its CHANGE_MEs
# can stay), or leave the section out. examples/glossop.toml is a filled-in
# board (trains from Glossop to Manchester, buses from two stops).
#
# Where it works: trains anywhere in Great Britain (National Rail Darwin).
# Bus times and positions from BODS cover England only. The rain warning
# (Open-Meteo) works anywhere.

# The heading on the board, like "Glossop > Manchester Picc". Defaults to "Departures".
# title = "Departures"
timezone = "Europe/London"
state_file = "/var/lib/departureboard/state.json"
# Never redraw more often than this, even if the data changes sooner.
min_redraw_minutes = 2
# "sign": amber dot-matrix station board (needs the yellow accent).
# "plain": white board with bold type and a red accent.
theme = "sign"
# Defaults to the theme's colour. Only reinforces meaning; text always carries it.
# accent = "yellow"
# "inky": Pimoroni Inky pHAT (or any Inky the library detects).
# "inky-phat-v1": the original Inky pHAT (before 2019, 212x104), which has no EEPROM.
#   It can't be detected, so say its colour: panel_colour = "red", "yellow" or "black".
# "waveshare-10in85g": Waveshare 10.85" e-Paper (G), 1360x480. Needs dtoverlay=spi0-0cs.
# "hdmi-1280x400": Waveshare 7.9" HDMI screen on its side. Runs as a service, not a timer.
display = "inky"
# Trains and buses run a Sunday service on bank holidays (from GOV.UK): treat
# them like Sundays, so only windows including Sun apply.
bank_holidays = true
# Whose bank holidays: "england-and-wales", "scotland" or "northern-ireland".
bank_holiday_division = "england-and-wales"
# The plain look's text size, 9-16 (11 is standard); bigger shows fewer departures on a small display.
# text_size = 12
# Degrees to turn the board clockwise to suit how it is mounted.
# E-paper: 0 or 180. The 7.9" screen is portrait out of the box: 90 or 270.
rotate = 0

[train]
# enabled = false   # switches trains off; the rest of [train] is kept, unread
# Your station's 3-letter code (CRS), like "GLO" for Glossop. National Rail's
# station pages show it.
crs = "CHANGE_ME"
# Optional: only trains calling at this station, like "MAN" for Manchester Piccadilly.
# filter_crs = "CHANGE_ME"
rows = 3
interval_minutes = 2
stale_after_minutes = 6
windows = ["Mon-Fri 06:30-09:30", "Mon-Fri 16:30-19:30"]
# Minutes to walk to the station; the board shows when to leave for the next train.
# walk_minutes = 7
# Copy the exact base URL from the Rail Data Marketplace product page if it differs.
# base_url = "https://api1.raildata.org.uk/1010-live-departure-board-dep1_2/LDBWS/api/20220120"

# Buses. The BODS timetable and positions (source = "bods") cover England only.
[bus]
# enabled = false   # switches buses off; the rest of [bus] is kept, unread
# Rows shown. Each stop call returns several buses, so more rows cost no extra hits.
rows = 3
# Optional: only show buses whose direction contains one of these, like ["Hyde"].
directions = []
# Every poll costs one hit per stop. TransportAPI free plan is 30 hits/day;
# the budget keeps 2 spare for manual probes.
# 2 stops x (07:00-08:30 every 12 min = 8 polls + 17:00-18:00 = 6 polls) = 28 hits.
interval_minutes = 12
stale_after_minutes = 30
daily_budget = 28
windows = ["Mon-Fri 07:00-08:30", "Mon-Fri 17:00-18:00"]

# Or work bus times out the way bustimes.org does: from the BODS timetable for
# your stops plus live BODS bus positions. Free (needs BODS_API_KEY), so buses
# can be checked all day. `departureboard timetable` builds the timetable, and
# departureboard-timetable.timer keeps it fresh (rebuilt weekly, or when your
# stops or operators change). Until there is one, TransportAPI stands in if
# its keys are set: every fallback_interval_minutes (default 12), within
# daily_budget, and only inside fallback_windows (default: the bus windows).
# operators are the bus companies' national operator codes; find them on
# bustimes.org, or in TransportAPI's "operator" (`departureboard probe bus --save`).
# source = "bods"
# operators = ["CHANGE_ME"]   # like ["BNML", "HIPK"] in Glossop
# interval_minutes = 2
# windows = ["Mon-Sun 06:00-23:00"]
# fallback_windows = ["Mon-Fri 07:00-08:30", "Mon-Fri 17:00-18:00"]

# Short label shown on the board = the stop's ATCO code. Find codes on
# bustimes.org: open your stop; the code is in its address. Add a line per stop.
[bus.stops]
A = "CHANGE_ME"   # like "1000DGHS0900"
# B = "CHANGE_ME"

# Minutes to walk to each stop, by label. A single number applies to every stop.
# [bus.walk_minutes]
# A = 7

# HDMI screen only: a second page showing where the next bus you can catch is,
# on the stops before yours. Needs BODS_API_KEY in secrets.env. Positions are
# polled every position_interval_seconds (default 30) inside the bus windows.
# `departureboard route` prints this block for you; see the user guide.
# [bus.routes.LINE]
# stop = "A"            # your stop's label from [bus.stops]
# stops = [             # in the order the bus calls; yours last
#   { name = "Previous stop", lat = 0.0, lon = 0.0 },
#   { name = "Your stop",     lat = 0.0, lon = 0.0 },
# ]

# Optional: a rain warning from Open-Meteo's forecast (free, no key). The board
# says "Rain from 07:10 (70%)" when rain is likely before you would reach the
# next train or bus you can still catch (or within the hour, without walk
# times). Polled every 30 minutes, only inside the train and bus windows.
# Two decimal places is plenty; that is all that is sent.
# [weather]
# lat = CHANGE_ME   # like 53.44 in Glossop
# lon = CHANGE_ME   # like -1.95
# threshold_percent = 50   # chance of rain, 1-100, worth a warning
