# Copy to /etc/departureboard/config.toml and edit.
# Secrets live in /etc/departureboard/secrets.env, not here.

title = "Glossop > Manchester Picc"
timezone = "Europe/London"
state_file = "/var/lib/departureboard/state.json"
# Redraw at least this often while a window is active, so "Upd" stays honest.
refresh_every_minutes = 10
# "red" or "yellow". Only reinforces meaning; text always carries it.
accent = "red"
# Set true if the Pi is mounted with the display upside down.
rotate_180 = false

[train]
crs = "GLO"
filter_crs = "MAN"
rows = 3
interval_minutes = 2
stale_after_minutes = 6
windows = ["Mon-Fri 06:30-09:30", "Mon-Fri 16:30-19:30"]
# Copy the exact base URL from the Rail Data Marketplace product page if it differs.
# base_url = "https://api1.raildata.org.uk/1010-live-departure-board-dep/LDBWS/api/20220120"

[bus]
# ATCO code of your stop (see README for how to find it).
atco = "CHANGE_ME"
rows = 2
# Optional: only show buses whose direction contains one of these.
directions = []
interval_minutes = 6
stale_after_minutes = 18
# TransportAPI free plan is 30 hits/day; keep 2 spare for manual test calls.
# 07:00-08:30 every 6 min = 16 calls, 17:00-18:00 every 6 min = 11 calls.
daily_budget = 28
windows = ["Mon-Fri 07:00-08:30", "Mon-Fri 17:00-18:00"]
