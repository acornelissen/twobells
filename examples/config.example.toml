# Optional. Without a config.toml the app uses its defaults, and the setup
# wizard and the settings tabs (/settings, port 8090) set it up for you,
# saving in the install's store (settings.toml) over this file, which is never
# rewritten. Only what the settings manage is saved there: addresses
# (base_url), state_file, display, panel_colour, [bus] fallback_windows,
# fallback_interval_minutes and position_interval_seconds, and [dashboard]
# allowed_hosts and state_dir are read from this file alone.
#
# On a Pi, install.sh copies this to /etc/twobells/config.toml. In
# Docker, mount one with docker-compose.override.yml; on a desktop, give one
# with --config. Keys live in secrets.env, never here.
#
# Until it is set up, the board shows "Set me up" and the settings' address,
# and the dashboard's address opens the settings. To set it up by hand
# instead, replace every CHANGE_ME; nothing shows departures until you do. If
# you don't want trains or buses, put enabled = false in [train] or [bus] (its
# CHANGE_MEs can stay), or leave the section out. examples/glossop.toml is a
# filled-in one (trains from Glossop to Manchester, buses from two stops).
#
# Where it works: trains anywhere in Great Britain (National Rail Darwin).
# Bus times and positions from BODS cover England only. The rain warning
# (Open-Meteo) works anywhere.

# The heading on the dashboard and the board's plain look, like
# "Glossop > Manchester Picc". Defaults to "Departures". Also on the General tab.
# title = "Departures"
# The zone departures and checking times are in. Also on the General tab.
timezone = "Europe/London"
# The store: the folder everything saved goes in, named by its state file.
# A Pi's services use /var/lib/twobells and Docker /data, whatever
# this says. Leave it out on a desktop, where the store has its own place.
state_file = "/var/lib/twobells/state.json"
# Never redraw more often than this, even if the data changes sooner.
min_redraw_minutes = 2
# "sign": amber dot-matrix station board, with a yellow accent (or red, on e-paper).
# "plain": white board with bold type and a red accent.
theme = "sign"
# Defaults to the theme's colour. Only reinforces meaning; text always carries it.
# accent = "yellow"
# "inky": Pimoroni Inky pHAT (or any Inky the library detects).
# "inky-phat-v1": the original Inky pHAT (before 2019, 212x104), which has no EEPROM.
#   It can't be detected, so say its colour: panel_colour = "red", "yellow" or "black".
# "waveshare-10in85g": Waveshare 10.85" e-Paper (G), 1360x480. Needs dtoverlay=spi0-0cs.
# "hdmi-1280x400": Waveshare 7.9" HDMI screen on its side. Runs as a service, not a timer.
# "hdmi-1920x440": an 11.3" 1920x440 HDMI bar screen. Runs as a service, not a timer.
# Set here only: changing it means switching services.
display = "inky"
# Trains and buses run a Sunday service on bank holidays (from GOV.UK): treat
# them like Sundays, so only windows including Sun apply.
bank_holidays = true
# Whose bank holidays: "england-and-wales", "scotland" or "northern-ireland".
bank_holiday_division = "england-and-wales"
# The plain look's text size, 9-16 (11 is standard); bigger shows fewer departures on a small display.
# text_size = 12
# Degrees to turn the board clockwise to suit how it is mounted.
# E-paper: 0 or 180. The 7.9" screen is portrait out of the box: 90 or 270.
rotate = 0

# Which views are on: "board" (a Pi only), "dashboard", or both. The setup
# wizard and the General tab set it. Default: the board on a Pi, the
# dashboard in Docker and on a desktop.
# [app]
# views = ["board", "dashboard"]

[train]
# enabled = false   # switches trains off; the rest of [train] is kept, unread
# Your station's 3-letter code (CRS), like "GLO" for Glossop. National Rail's
# station pages show it.
crs = "CHANGE_ME"
# Optional: only trains calling at this station, like "MAN" for Manchester Piccadilly.
# filter_crs = "CHANGE_ME"
rows = 3
interval_minutes = 2
stale_after_minutes = 6
windows = ["Mon-Fri 06:30-09:30", "Mon-Fri 16:30-19:30"]
# Minutes to walk to the station; the board shows when to leave for the next train.
# walk_minutes = 10
# Copy the exact base URL from the Rail Data Marketplace product page if it differs.
# base_url = "https://api1.raildata.org.uk/1010-live-departure-board-dep1_2/LDBWS/api/20220120"

# Buses, worked out the way bustimes.org does: from the BODS timetable for
# your stops plus live BODS bus positions. Free (needs BODS_API_KEY), so buses
# can be checked all day. BODS covers England only. `twobells timetable`
# builds the timetable, and twobells-timetable.timer keeps it fresh
# (rebuilt weekly, or when your stops or operators change).
[bus]
# enabled = false   # switches buses off; the rest of [bus] is kept, unread
# The default; source = "transportapi" uses TransportAPI alone (below).
source = "bods"
# The bus companies whose timetables to read, by national operator code. The
# setup wizard and `twobells setup discover` find them for your stops;
# bustimes.org shows them too.
operators = ["CHANGE_ME"]   # like ["BNML", "HIPK"] in Glossop
rows = 3
# Optional: only show buses whose direction contains one of these, like ["Hyde"].
directions = []
interval_minutes = 2
stale_after_minutes = 30
# Default: every day, 06:00-23:00. TransportAPI, standing in, keeps to its
# own fallback_windows (below), whatever these say.
# windows = ["Mon-Sun 06:00-23:00"]
# The HDMI screen's bus page ([bus.routes], below): how often to check where
# the buses are, at least 10 (BODS refreshes every 10 s).
# position_interval_seconds = 30

# Until there is a usable timetable, TransportAPI stands in if its keys
# (TAPI_APP_ID, TAPI_APP_KEY) are set. Its free plan is 30 hits a day, and
# every check costs one hit per stop, so it checks every
# fallback_interval_minutes, within daily_budget (2 spare for manual probes),
# and only inside fallback_windows (default: the ones below, the commute).
# 2 stops x (07:00-08:30 every 12 min = 8 checks + 17:00-18:00 = 6 checks) = 28 hits.
# fallback_interval_minutes = 12
# fallback_windows = ["Mon-Fri 07:00-08:30", "Mon-Fri 17:00-18:00"]
# daily_budget = 28
# TransportAPI's address; change it only if TransportAPI moves it.
# base_url = "https://transportapi.com/v3"
#
# Or TransportAPI alone, with no timetable: take out source and operators,
# and set interval_minutes and windows to its pace and its windows:
# interval_minutes = 12
# windows = ["Mon-Fri 07:00-08:30", "Mon-Fri 17:00-18:00"]

# Short label shown on the board = the stop's ATCO code. Find codes on
# bustimes.org: open your stop; the code is in its address. Add a line per stop.
[bus.stops]
A = "CHANGE_ME"   # like "1000DGHS0900"
# B = "CHANGE_ME"

# Minutes to walk to each stop, by label. A single number applies to every stop.
# [bus.walk_minutes]
# A = 10

# HDMI screen only: a second page showing where the next bus you can catch is,
# on the stops before yours. Needs BODS_API_KEY in secrets.env. Positions are
# checked every position_interval_seconds ([bus], above) inside the bus windows.
# `twobells route` prints this block for you; see the user guide.
# [bus.routes.LINE]
# stop = "A"            # your stop's label from [bus.stops]
# stops = [             # in the order the bus calls; yours last
#   { name = "Previous stop", lat = 0.0, lon = 0.0 },
#   { name = "Your stop",     lat = 0.0, lon = 0.0 },
# ]

# The dashboard view only; the board ignores this.
# All optional; the values shown are the defaults. All but state_dir and allowed_hosts
# can be changed on the Dashboard tab too.
# [dashboard]
# The store, when state_file above isn't set. Default: /var/lib/twobells
# on a Pi, /data in Docker, ~/Library/Application Support/twobells on a
# Mac, else twobells in $XDG_STATE_HOME or ~/.local/state.
# state_dir = "/path/to/folder"
# train_rows = 10                 # 1-20
# bus_rows = 10                   # 1-20
# train_interval_seconds = 60     # at least 30
# bus_interval_seconds = 30       # at least 15
# weather_interval_minutes = 30   # at least 10
# quiet_windows = ["Mon-Sun 01:00-05:00"]   # no checks then, unless the page is open
# late_minutes_train = 3          # 1-60: how late counts as late in the history
# late_minutes_bus = 2            # 1-60
# history_days = 90               # 1-3650: days of history kept and shown
# row_strips = true               # each row's small drawing of its stops; never on a wall tablet
# allowed_hosts = []              # extra host names the dashboard and settings answer to, like ["ds.home"]
# Rail engineering works: the Knowledgebase Incidents address from the RDM
# product page. Until it is set, they stay off, even with RDM_KB_API_KEY. The
# Dashboard tab takes an address at raildata.org.uk; any other goes here.
# kb_incidents_url = "https://..."

# Optional: a rain warning from Open-Meteo's forecast (free, no key). The board
# says "Rain from 07:10 (70%)" when rain is likely before you would reach the
# next train or bus you can still catch (or within the hour, without walk
# times). Polled every 30 minutes, only inside the train and bus windows.
# Two decimal places is plenty; that is all that is sent.
# [weather]
# enabled = true   # false switches the warning off; the location is kept, unread
# lat = CHANGE_ME   # like 53.44 in Glossop
# lon = CHANGE_ME   # like -1.95
# threshold_percent = 50   # chance of rain, 1-100, worth a warning

