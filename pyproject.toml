[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "departureboard"
version = "0.1.0"
description = "Train and bus departures for Great Britain, on an e-paper or HDMI board on a Raspberry Pi and on a web dashboard, installed on a Pi, in Docker or on a desktop"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Albert Cornelissen" }]
keywords = ["departures", "trains", "buses", "national-rail", "bods", "e-paper", "raspberry-pi", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]
dependencies = ["Pillow>=10.1"]

[project.urls]
Homepage = "https://github.com/acornelissen/inky-departures"
Source = "https://github.com/acornelissen/inky-departures"
Issues = "https://github.com/acornelissen/inky-departures/issues"
Documentation = "https://github.com/acornelissen/inky-departures/blob/main/docs/user-guide.md"

[project.optional-dependencies]
pi = ["inky>=2.0"]
screen = ["pygame>=2.5"]

[dependency-groups]
# The tools for working on the board (uv sync installs them; uv.lock pins them).
# pygame is here for the screen's tests; fonttools builds the vendored fonts
# (tools/build_fonts.py) and the Board look's dot-matrix face (tools/build_dotfont.py).
dev = [
    "pytest>=8",
    "pygame>=2.5",
    "fonttools[woff]>=4.55",
    "ruff==0.16.10",
    "pyright==1.1.406",
    "pytest-xdist>=3.6",
]

[project.scripts]
departureboard = "departureboard.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"departureboard" = ["data/*.csv", "dashboard_static/**/*", "wizard_static/*"]
"departureboard.board" = ["fonts/*"]
"departureboard.emulator" = ["*.html"]
"departureboard.web" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "A", "N", "BLE", "I", "UP", "SIM", "C4", "RUF", "S"]
ignore = [
    "N818",  # exception names without an Error suffix are public API; renaming them is churn
    "RUF001",  # typographic quotes and symbols in user-facing text are deliberate
    "RUF059",  # unused names in unpacking say what each part is
    "UP042",  # a StrEnum's str() differs from a (str, Enum)'s; not worth the behaviour change
    "SIM108",  # an if/else block often reads better than a long or nested conditional expression
]

[tool.ruff.lint.per-file-ignores]
# Tests keep long fixture strings and asserts on one line, and use `l` for a
# live row in short comprehensions.
# Tests assert, use made-up keys and passwords, and bind and fetch freely; their
# regexes are full of braces, which % keeps readable where an f-string can't.
"tests/**" = ["E501", "E741", "S", "UP031"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
