[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "departureboard"
version = "0.1.0"
description = "Train and bus departure board for a Raspberry Pi with an e-paper or HDMI display, for Great Britain"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
pi = ["inky>=2.0"]
screen = ["pygame>=2.5"]
dev = ["pytest>=8", "pygame>=2.5"]

[project.scripts]
departureboard = "departureboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
departureboard = ["*.html", "*.css", "data/*.csv", "dashboard_static/*", "dashboard_static/**/*", "wizard_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
