[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "departureboard"
version = "0.1.0"
description = "Train and bus departure board for a Raspberry Pi with an e-paper or HDMI display, for Great Britain"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
pi = ["inky>=2.0"]
screen = ["pygame>=2.5"]

[dependency-groups]
# The tools for working on the board (uv sync installs them; uv.lock pins them).
# pygame is here for the screen's tests.
dev = ["pytest>=8", "pygame>=2.5", "ruff==0.16.10"]

[project.scripts]
departureboard = "departureboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
departureboard = ["*.html", "*.css", "data/*.csv", "dashboard_static/*", "dashboard_static/**/*", "wizard_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "A", "N", "BLE"]
ignore = [
    "N818",  # exception names without an Error suffix are public API; renaming them is churn
]

[tool.ruff.lint.per-file-ignores]
# Tests keep long fixture strings and asserts on one line, and use `l` for a
# live row in short comprehensions.
"tests/**" = ["E501", "E741"]
