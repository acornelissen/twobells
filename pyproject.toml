[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "departureboard"
version = "0.1.0"
description = "Glossop train and bus departure board for a Raspberry Pi Zero W with an Inky pHAT"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
pi = ["inky>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
departureboard = "departureboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
