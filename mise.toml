# Tool versions and tasks for working on the board. `mise install`, then
# `mise run setup` once; `mise tasks` lists the rest.
[tools]
python = "3.12.14"  # the Dockerfile's python:3.12-slim
ruff = "0.16.10"    # for editors and the shell; keep in step with ruff in pyproject's dev group
node = "22.22.3"    # only for the JS behaviour tests, which skip without node
uv = "0.12.24"      # installs the package and dev tools from uv.lock

[env]
# The project's venv, made with the python above on first use and active in
# the shell. Tasks still name .venv/bin/ outright, so a venv activated by hand
# elsewhere can't take their place on PATH.
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the package and its dev tools into .venv, as uv.lock pins them"
run = "uv sync --locked"

[tasks.test]
description = "Run the test suite"
run = ".venv/bin/pytest -q"

[tasks.lint]
description = "Check the code with ruff"
run = ".venv/bin/ruff check src tests tools"

[tasks.typecheck]
description = "Check types with pyright"
run = ".venv/bin/pyright"
# Quiets the PyPI wrapper's note on every run that a newer pyright is out.
env = { PYRIGHT_PYTHON_IGNORE_WARNINGS = "1" }

[tasks.demo]
description = "Render sample data to preview.png"
run = ".venv/bin/departureboard demo --png preview.png"

[tasks.emulate]
description = "Browser panel emulator with sample data"
run = ".venv/bin/departureboard emulate --demo"

[tasks.serve]
description = "Serve the dashboard and settings on this computer with ./config.toml and ./secrets.env"
run = ".venv/bin/departureboard serve --install desktop --config config.toml --secrets secrets.env"
