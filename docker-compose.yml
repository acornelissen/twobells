# The departures dashboard on a NAS. On Synology: Container Manager > Project >
# Create, pick this folder, and it builds the image here. See docs/USER_GUIDE.md.
# Set it up on its settings page; a config.toml kept by hand instead goes in
# through docker-compose.override.yml (see docker-compose.override.yml.example).
services:
  departureboard:
    build: .
    image: departureboard:local
    container_name: departureboard
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - secrets.env              # the keys, from deploy/secrets.env.example; keep it readable by you only
    volumes:
      # Bus timetable, history, bank holidays, saved settings and keys, settings
      # password. Its name is the dashboard's from before, so nothing saved is lost.
      - dashboard-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  dashboard-data:
