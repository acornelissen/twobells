# The departures dashboard on a NAS. On Synology: Container Manager > Project >
# Create, pick this folder, and it builds the image here. See docs/docker.md.
# Set it up in its settings site (/settings); a config.toml kept by hand instead goes in
# through docker-compose.override.yml (see docker-compose.override.yml.example).
services:
  twobells:
    build: .
    image: twobells:local
    container_name: twobells
    restart: unless-stopped
    # IPv4 only: Docker hands IPv6 visitors on from its own network's gateway,
    # which the app would take for the home network.
    ports:
      - "0.0.0.0:8090:8090"
    env_file:
      - secrets.env              # the keys, from deploy/secrets.env.example; keep it readable by you only
    volumes:
      # Bus timetable, history, bank holidays, saved settings and keys, settings
      # password. Named outright, so it is the same whatever the folder is called.
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  data:
    name: twobells-data
