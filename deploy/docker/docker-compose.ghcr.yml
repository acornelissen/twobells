# The departures dashboard from a published release image, for Docker on any
# computer or NAS: no source folder and nothing to build. Published from the
# first release on; docker-compose.yml builds from source instead.
#
# Pin the release by version and digest, as below, so the image can't change
# under you. On any computer with Docker and cosign, for version X.Y.Z:
#   docker pull ghcr.io/acornelissen/inky-departures:X.Y.Z    # prints "Digest: sha256:..."
#   cosign verify ghcr.io/acornelissen/inky-departures@sha256:<digest> \
#     --certificate-identity https://github.com/acornelissen/inky-departures/.github/workflows/release.yml@refs/tags/vX.Y.Z \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# then put the version and the digest in image: below. Until then compose
# refuses the placeholder, so nothing unpinned runs. See docs/docker.md.
#
# Keys: paste them in the settings (kept in the volume, readable by the app
# only), or uncomment env_file with a secrets.env next to this file.
services:
  departureboard:
    image: ghcr.io/acornelissen/inky-departures:X.Y.Z@sha256:DIGEST
    container_name: departureboard
    restart: unless-stopped
    ports:
      - "8090:8090"
    # env_file:
    #   - secrets.env
    volumes:
      # Bus timetable, history, bank holidays, saved settings and keys,
      # settings password. A new named volume takes the image's owner
      # (uid 10001); a folder instead must be given to 10001 by hand.
      - dashboard-data:/data
      # Optional: a config.toml kept by hand (for allowed_hosts, say).
      # - ./config.toml:/config/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  dashboard-data:
