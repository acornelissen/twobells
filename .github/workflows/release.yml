# Publishes a release when a tag like v0.1.0 is pushed:
#
#   verify   the tag is vX.Y.Z, equals pyproject.toml's version and is on main;
#            lint, the type check and tests pass
#   dist     sdist and wheel, built with hashed build tools, smoke-tested
#   image    multi-arch container (amd64, arm64) to GHCR with SBOM and
#            provenance, signed with cosign (keyless) by digest
#   tarball  source tarball for the Pi (git archive of the tag), SHA256SUMS
#            over every release file, signed with cosign sign-blob (keyless)
#   pypi     sdist and wheel to PyPI by trusted publishing (no stored token);
#            runs after everything else built, as a PyPI version is permanent
#   release  the GitHub release with the tarball, SHA256SUMS, its signature
#            bundle, and the wheel (the sdist is on PyPI only: it would share
#            the Pi tarball's name, twobells-X.Y.Z.tar.gz, which upgrade.sh fetches)
#
# Cutting a release: set version in pyproject.toml, merge to main, then
#   git tag -s v0.1.0 -m v0.1.0 && git push origin v0.1.0
#
# One-time setup by the repo owner (none of it can be done from here):
#   1. PyPI trusted publisher. On pypi.org (Account > Publishing > Add a new
#      pending publisher, as the project doesn't exist yet): PyPI project name
#      twobells, owner acornelissen, repository twobells,
#      workflow release.yml, environment pypi.
#   2. GitHub environment "pypi" (Settings > Environments > New environment).
#      Under deployment branches and tags, allow tags matching v* only.
#      Optionally add yourself as a required reviewer, so every PyPI upload
#      waits for a click.
#   3. Tag ruleset (Settings > Rules > Rulesets > New tag ruleset): target
#      v*, restrict creation, update and deletion to admins, so only you can
#      start a release.
#   4. GHCR visibility. The first release creates the package
#      ghcr.io/acornelissen/twobells as private. When the repo goes
#      public, set the package to public (Package settings > Change
#      visibility) and check it is linked to this repository.
#   5. Note: cosign keyless signing writes the signing identity (this repo's
#      name and workflow path) to Sigstore's public transparency log. Cut the
#      first release after the repo is public, or accept that the name shows.
#
# Verifying, as a user:
#   cosign verify ghcr.io/acornelissen/twobells:0.1.0 \
#     --certificate-identity https://github.com/acornelissen/twobells/.github/workflows/release.yml@refs/tags/v0.1.0 \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity https://github.com/acornelissen/twobells/.github/workflows/release.yml@refs/tags/v0.1.0 \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum --check --ignore-missing SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/acornelissen/twobells
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  verify:
    name: Verify tag, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # to check the tagged commit is on main
      - name: Check the tag matches pyproject.toml and is on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pyproject.toml version '$version' is not X.Y.Z"
            exit 1
          fi
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version '$version' (expected v$version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at a commit that is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          cache: false # nothing cached feeds a release
      - run: mise run setup
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test

  dist:
    name: Build sdist and wheel
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: python
          cache: false
      - name: Build
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install --require-hashes -r .github/requirements-build.txt
          "$RUNNER_TEMP/build/bin/python" -m build --no-isolation --outdir dist .
          ls -l dist
          test -f "dist/twobells-$VERSION.tar.gz"
          test -f "dist/twobells-$VERSION-py3-none-any.whl"
      - name: Install the wheel into a fresh venv and check its version
        run: |
          python -m venv "$RUNNER_TEMP/try"
          "$RUNNER_TEMP/try/bin/pip" install --require-hashes --only-binary=:all: --no-deps -r deploy/docker/requirements-docker.txt
          "$RUNNER_TEMP/try/bin/pip" install --no-deps --no-index "dist/twobells-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          got="$("$RUNNER_TEMP/try/bin/twobells" --version)"
          if [[ "$got" != "twobells $VERSION" ]]; then
            echo "::error::The wheel says '$got', not 'twobells $VERSION'"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Container image (amd64, arm64)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  tarball:
    name: Source tarball, SHA256SUMS and signature
    needs: [verify, dist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: out/
      - name: Archive the tagged source
        # What the Pi's scripts in deploy/pi/ need (pyproject.toml, LICENSE, src/,
        # deploy/ and examples/) plus the docs; not the tests, the CI, or the
        # local issue tracker and agent files. It takes the name upgrade.sh
        # fetches, which is also the sdist's: the sdist goes to PyPI only.
        run: |
          rm "out/twobells-$VERSION.tar.gz"  # the sdist, from dist
          git archive --format=tar.gz --prefix="twobells-$VERSION/" \
            -o "out/twobells-$VERSION.tar.gz" "$GITHUB_SHA" -- . \
            ':(exclude).beads' ':(exclude).claude' ':(exclude).github' \
            ':(exclude)tests' ':(exclude)CLAUDE.md'
          # Listed once, not piped to grep -q: under pipefail, tar would fail
          # writing to a grep that has already found its line and gone.
          listing="$(tar -tzf "out/twobells-$VERSION.tar.gz")"
          for script in install.sh update.sh upgrade.sh; do
            grep -qx "twobells-$VERSION/deploy/pi/$script" <<<"$listing"
          done
      - name: Write SHA256SUMS
        working-directory: out
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign SHA256SUMS
        working-directory: out
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: [dist, image, tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/twobells/
    permissions:
      id-token: write # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: GitHub release
    needs: [verify, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out/
      - name: Create the release
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install on a Raspberry Pi

          SHA256SUMS covers every file here and is signed with Sigstore (keyless). Check it with
          cosign 2.5 or later ([installing cosign](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install-pi.md#install-cosign)),
          then the tarball against it:

          \`\`\`bash
          curl -fLO $base/twobells-$VERSION.tar.gz
          curl -fLO $base/SHA256SUMS
          curl -fLO $base/SHA256SUMS.sigstore.json
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity $identity \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com &&
            sha256sum --check --ignore-missing SHA256SUMS &&
            tar -xzf twobells-$VERSION.tar.gz &&
            cd twobells-$VERSION && sudo ./deploy/pi/install.sh
          \`\`\`

          A Pi installed from an earlier release moves to this one, checked the same way,
          from the earlier release's folder: \`sudo ./deploy/pi/upgrade.sh $VERSION\`

          ## Container

          Check the image with cosign 3.0 or later. Container (linux/amd64, linux/arm64): \`$IMAGE:$VERSION\`

          \`\`\`bash
          cosign verify $IMAGE:$VERSION \\
            --certificate-identity $identity \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            out/*
