# Rebuilds the setup wizard's station and bus-area files from NaPTAN once a
# month (tools/build_setup_data.py; about 130 MB down) and, if the data
# itself changed, opens a pull request for review. It never pushes to main.
# A refresh that only moves the "downloaded <date>" header line is dropped.
#
# Four jobs, so that nothing which downloads or runs code holds a write token:
#   build    read-only: rebuilds, tests against the new data and hands the
#            changed files on as an artefact
#   propose  only if the data changed: checks the artefact holds nothing but
#            the expected CSV files, then opens the pull request. It runs no
#            project code, no mise and no pip.
#   ci       only if a pull request is open: ci.yml, read-only, on the pull
#            request's commit
#   report   puts ci's result on that commit as the "CI" status. It may set
#            statuses and nothing else, checks nothing out and runs no
#            project code.
#
# One-time setup by the repo owner:
#   Settings > Actions > General > Workflow permissions: tick "Allow GitHub
#   Actions to create and approve pull requests", or the PR step fails.
#
# A pull request opened with the workflow's own token doesn't start CI (a
# GitHub rule against loops), so this run calls CI itself. The checks of a
# called workflow belong to the commit this run started on (main), not to
# the pull request's, so report puts the result where the pull request shows it.
name: Refresh NaPTAN data

on:
  schedule:
    - cron: "17 5 3 * *" # 05:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1" # every tool as mise.lock pins it, or none
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.3
          cache: false
      - name: Rebuild from NaPTAN
        run: python tools/build_setup_data.py
      - name: Keep it only if the data changed
        id: diff
        run: |
          if git diff --quiet -I '^# ' -- src/twobells/data; then
            echo "No change beyond the header; nothing to propose."
            git checkout -- src/twobells/data
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- src/twobells/data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test against the new data
        if: steps.diff.outputs.changed == 'true'
        run: |
          mise run setup
          mise run test
      - name: Gather the changed files
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir "$RUNNER_TEMP/setup-data"
          git diff --name-only -z -- 'src/twobells/data/*.csv' | xargs -0 cp -t "$RUNNER_TEMP/setup-data" --
          ls -l "$RUNNER_TEMP/setup-data"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: setup-data
          path: ${{ runner.temp }}/setup-data/
          if-no-files-found: error
          retention-days: 7

  propose:
    # Holds the write token, so it takes nothing from build but the files,
    # and checks them before they go near the pull request.
    name: Propose
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the PR branch (never main)
      pull-requests: write # open the PR
    outputs:
      # The open pull request (none if there is no change to propose) and
      # its commit as pushed: ci tests that commit and report marks it.
      pull-request: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup-data
          path: ${{ runner.temp }}/setup-data/
      - name: Check the artefact holds only the expected data files
        # Names, kinds and sizes only; what the files say is for the review.
        # A name is never printed as it is: it came from the artefact.
        working-directory: ${{ runner.temp }}/setup-data
        run: |
          shopt -s nullglob dotglob
          found=0
          for name in *; do
            case "$name" in
              gb_stations.csv | london_stops.csv | metrolink_stops.csv | naptan_area_grid.csv) ;;
              *)
                printf '::error::The artefact holds an unexpected file: %q\n' "$name"
                exit 1
                ;;
            esac
            if [[ -L "$name" || ! -f "$name" ]]; then
              printf '::error::%q in the artefact is not a regular file\n' "$name"
              exit 1
            fi
            size=$(( $(wc -c < "$name") ))
            if (( size == 0 || size > 1048576 )); then
              printf '::error::%q in the artefact is %d bytes, not between 1 byte and 1 MiB\n' "$name" "$size"
              exit 1
            fi
            found=$((found + 1))
          done
          if (( found == 0 )); then
            echo "::error::The artefact holds no data files"
            exit 1
          fi
      - name: Put the new data in place
        run: cp -- "$RUNNER_TEMP"/setup-data/*.csv src/twobells/data/
      # Rather than gh pr create: it pushes the branch with its own scoped
      # auth (checkout keeps no credentials) and makes signed commits.
      - name: Open a pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/naptan-refresh
          delete-branch: true
          add-paths: src/twobells/data/*.csv
          sign-commits: true
          commit-message: |
            chore(data): refresh setup data from NaPTAN

            Monthly rebuild by tools/build_setup_data.py (data.yml).
          title: "chore(data): refresh setup data from NaPTAN"
          body: |
            Monthly rebuild of `src/twobells/data/` from NaPTAN by
            `tools/build_setup_data.py`. The test suite passed against it in
            the workflow run.

            Before merging, skim the diff: stations added or gone, positions
            that jumped, bus areas that vanished. CI does not start on its
            own for this PR: the workflow run calls it and puts the result
            on the PR's commit as the "CI" status.

  ci:
    # Runs the tests on what the pull request holds, so it gets no more than
    # a read-only token (a called workflow's jobs can't have more than this
    # job grants), and no secret is passed to it.
    name: CI on the pull request
    needs: propose
    if: needs.propose.outputs.pull-request != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.propose.outputs.sha }}

  report:
    # Every outcome is reported, a failed or cancelled run as well, on the
    # commit ci tested, never on whatever the branch holds by then.
    name: Report CI on the pull request
    needs: [propose, ci]
    if: always() && needs.propose.outputs.pull-request != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write # the commit status, nothing else
    steps:
      - name: Set the CI status on the pull request's commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.propose.outputs.sha }}
          RESULT: ${{ needs.ci.result }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The pull request's commit is not a full SHA"
            exit 1
          fi
          case "$RESULT" in
            success) state=success description="Passed in the data refresh run" ;;
            failure) state=failure description="Failed in the data refresh run" ;;
            *) state=error description="Did not finish in the data refresh run" ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=CI -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "CI $state on $SHA"
